name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name GoldPortfolio gold_portfolio_app.pyw

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldPortfolio-Windows-EXE
          path: dist/GoldPortfolio.exe
